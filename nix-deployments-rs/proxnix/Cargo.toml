[package]
name = "proxnix"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
proxnix-core = { path = "../proxnix-core" }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.4", features = ["macros"] }
git2 = "0.20.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
libc = "0.2"
sozu-command-lib = "1.1.1"
serde_with = "3.23.0"
proxmox-api = { version = "0.2.0", features = ["reqwest-client"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }
